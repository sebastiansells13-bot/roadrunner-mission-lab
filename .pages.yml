media:
  input: src/_includes/img
  output: /img

content:
  - name: site
    label: "Site Settings"
    type: file
    path: src/_data/site.json
    fields:
      - { name: name, label: "Site name", type: string, required: true }
      - { name: org, label: "Organization name", type: string, required: true }
      - { name: tagline, label: "Tagline", type: string, required: true }
      - { name: description, label: "SEO description", type: text, options: { maxlength: 200 } }
      - { name: url, label: "Live site URL (used for share previews)", type: string }
      - name: navigation
        label: "Top navigation links"
        type: object
        list: true
        fields:
          - { name: text, label: "Label", type: string, required: true }
          - { name: url, label: "URL", type: string, required: true }

  - name: board
    label: "Homepage (Roadrunner Mission Lab)"
    type: file
    path: src/_data/board.json
    fields:
      - name: hero
        label: "Hero"
        type: object
        fields:
          - { name: kicker, label: "Kicker", type: string }
          - { name: title, label: "Title", type: string, required: true }
          - { name: subtitle, label: "Subtitle", type: text }
          - { name: pillars, label: "Pillar tags", type: string, list: true }

      - name: whyNow
        label: "Why Now"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow", type: string }
          - { name: headline, label: "Headline", type: string }
          - { name: statValue, label: "Stat value (e.g. 2.5×)", type: string }
          - { name: statLabel, label: "Stat label", type: text }
          - { name: source, label: "Source citation", type: string }
          - { name: strainedPillars, label: "Strained pillars", type: string, list: true }
          - { name: newPillars, label: "New / resilient pillars", type: string, list: true }

      - name: provenElsewhere
        label: "Proven Elsewhere"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow", type: string }
          - { name: headline, label: "Headline", type: string }
          - { name: closing, label: "Closing line", type: text }
          - name: cases
            label: "Case studies"
            type: object
            list:
              collapsible:
                summary: "{fields.org}"
            fields:
              - { name: org, label: "Organization", type: string, required: true }
              - { name: program, label: "Program", type: string }
              - { name: metric, label: "Headline metric", type: string }
              - { name: detail, label: "Detail", type: text }

      - name: lanes
        label: "Four Lanes (Mission Lab)"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow", type: string }
          - { name: headline, label: "Headline", type: string }
          - { name: sub, label: "Subhead", type: text }
          - { name: closing, label: "Closing line", type: text }
          - { name: labName, label: "Lab name", type: string }
          - name: items
            label: "Lanes"
            type: object
            list:
              collapsible:
                summary: "{fields.name}"
            fields:
              - { name: name, label: "Lane name", type: string, required: true }
              - { name: icon, label: "Icon", type: select, options: { values: [pulse, scan, leaf, snowflake] } }
              - { name: color, label: "Accent color", type: select, options: { values: [crimson, azure, sage, teal] } }
              - { name: figure, label: "Headline figure", type: string }
              - { name: figureLabel, label: "Figure label", type: string }

      - name: whereThisLeads
        label: "Where This Leads"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow", type: string }
          - { name: headline, label: "Headline", type: string }
          - { name: coreLabel, label: "Core box label", type: string }
          - { name: coreDetail, label: "Core box detail", type: text }
          - { name: labLabel, label: "Lab box label", type: string }
          - { name: labDetail, label: "Lab box detail", type: text }
          - { name: outcomeEyebrow, label: "Outcome eyebrow", type: string }
          - { name: outcomes, label: "Outcomes", type: string, list: true }
          - { name: capitalValue, label: "Capital figure", type: string }
          - { name: capitalLabel, label: "Capital label", type: string }

      - name: closing
        label: "Closing Statement"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow", type: string }
          - { name: headline, label: "Headline", type: text }
          - { name: body, label: "Body", type: text }

  - name: strategy
    label: "How It Works (Strategy Page)"
    type: file
    path: src/_data/strategy.json
    fields:
      - name: hero
        label: "Page Hero"
        type: object
        fields:
          - { name: kicker, label: "Kicker", type: string }
          - { name: title, label: "Title", type: string }
          - { name: subtitle, label: "Subtitle", type: text }
          - { name: issued, label: "Updated-date chip", type: string }

      - name: whoWeAre
        label: "Who Is RRFB"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow", type: string }
          - { name: headline, label: "Headline", type: string }
          - { name: mission, label: "Mission statement", type: text }
          - { name: facts, label: "Key facts", type: text, list: true }
          - { name: coreIdea, label: "Core idea callout", type: text }
          - { name: serviceAreas, label: "Service areas", type: string, list: true }

      - name: whyNow
        label: "Why Now (Strategy)"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow", type: string }
          - { name: headline, label: "Headline", type: string }
          - { name: sub, label: "Subhead", type: text }
          - name: reasons
            label: "Reasons"
            type: object
            list:
              collapsible:
                summary: "{fields.title}"
            fields:
              - { name: number, label: "Number", type: string }
              - { name: title, label: "Title", type: string }
              - { name: body, label: "Body", type: text }
              - { name: stat, label: "Supporting stat", type: string }
          - { name: closing, label: "Closing lines", type: string, list: true }

      - name: portfolio
        label: "Program Areas"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow", type: string }
          - { name: headline, label: "Headline", type: string }
          - { name: sub, label: "Subhead", type: text }
          - name: items
            label: "Program areas"
            type: object
            list:
              collapsible:
                summary: "{fields.name}"
            fields:
              - { name: name, label: "Name", type: string, required: true }
              - { name: kind, label: "Kind", type: select, options: { values: ["Earned revenue", "Enabling innovation"] } }
              - { name: description, label: "Description", type: text }

      - name: vetting
        label: "How We Choose What to Pursue"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow", type: string }
          - { name: headline, label: "Headline", type: string }
          - { name: sub, label: "Subhead", type: text }
          - name: criteria
            label: "Fit criteria"
            type: object
            list:
              collapsible:
                summary: "{fields.name}"
            fields:
              - { name: number, label: "Number", type: number }
              - { name: name, label: "Name", type: string }
              - { name: description, label: "Description", type: text }
          - { name: selected, label: "What moves forward", type: text, list: true }
          - name: decisions
            label: "Current priorities"
            type: object
            list:
              collapsible:
                summary: "{fields.item}"
            fields:
              - { name: status, label: "Status", type: select, options: { values: ["Active now", "Piloting", "In development", "Exploring"], creatable: true } }
              - { name: item, label: "Item", type: text }
          - { name: rule, label: "Decision rule", type: text }

      - name: proofPoints
        label: "Proof Points"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow", type: string }
          - { name: headline, label: "Headline", type: string }
          - name: items
            label: "Proof points"
            type: object
            list:
              collapsible:
                summary: "{fields.title}"
            fields:
              - { name: number, label: "Number", type: number }
              - { name: value, label: "Value", type: string }
              - { name: title, label: "Title", type: string }
              - { name: description, label: "Description", type: text }

      - name: roadmap
        label: "Roadmap"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow", type: string }
          - { name: headline, label: "Headline", type: string }
          - { name: closing, label: "Closing line", type: text }
          - name: stages
            label: "Stages"
            type: object
            list:
              collapsible:
                summary: "{fields.name}"
            fields:
              - { name: label, label: "Timeframe label", type: string }
              - { name: name, label: "Stage name", type: string }
              - { name: value, label: "Value", type: string }
              - { name: description, label: "Description", type: text }

      - name: help
        label: "Partner With Us"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow", type: string }
          - { name: headline, label: "Headline", type: string }
          - { name: sub, label: "Subhead", type: text }
          - name: columns
            label: "Columns"
            type: object
            list:
              collapsible:
                summary: "{fields.title}"
            fields:
              - { name: title, label: "Title", type: string }
              - { name: description, label: "Description", type: text }
              - name: items
                label: "Sub-items"
                type: object
                list:
                  collapsible:
                    summary: "{fields.title}"
                fields:
                  - { name: title, label: "Title", type: string }
                  - { name: description, label: "Description", type: text }
          - { name: closing, label: "Closing line", type: text }

      - name: author
        label: "Author / Contact"
        type: object
        fields:
          - { name: name, label: "Name", type: string }
          - { name: title, label: "Title", type: string }
          - { name: email, label: "Email", type: string }
          - { name: closing, label: "Call-to-action text", type: string }
          - { name: issued, label: "Last-updated note", type: string }
